name: Pipeline evaluation tests

# Guards the evaluation methodology: on data where the label is independent of
# every feature, an honest evaluation must land at chance. See
# docs/MLP_EVALUATION_AND_LEAKAGE.md.
on:
  push:
    paths:
      - "tests/**"
      - "pipeline_assets/**"
      - "run_pipeline.py"
      - "requirements-pipeline-tests.txt"
      - ".github/workflows/pipeline-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - "pipeline_assets/**"
      - "run_pipeline.py"
      - "requirements-pipeline-tests.txt"
      - ".github/workflows/pipeline-tests.yml"
  workflow_dispatch:
    inputs:
      run_slow:
        description: "Also run the slow nested_cv permutation test"
        type: boolean
        default: false

jobs:
  leakage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline-tests.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pipeline-tests.txt
      - name: Run evaluation leakage tests
        run: pytest tests -q
      - name: Run slow nested_cv permutation test
        if: inputs.run_slow
        run: pytest tests -q -m slow
