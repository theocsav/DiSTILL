name: API tests

# The API shells out to run_pipeline.py and reads presets/ and registries/ at
# runtime, so changes to any of those can break the API tests. Keep this list in
# sync with what apps/api actually depends on.
on:
  push:
    paths:
      - "apps/api/**"
      - "run_pipeline.py"
      - "presets/**"
      - "registries/**"
      - "scripts/**"
      - "pipeline_assets/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "run_pipeline.py"
      - "presets/**"
      - "registries/**"
      - "scripts/**"
      - "pipeline_assets/**"
      - ".github/workflows/api-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r apps/api/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest apps/api/tests
